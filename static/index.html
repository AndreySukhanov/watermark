<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLEANFRAME — AI Watermark Remover</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <span class="brand-name">CLEANFRAME</span>
        <span class="brand-dot"></span>
        <span class="brand-tag">AI Watermark Remover</span>
      </div>
    </header>

    <main class="main">

      <!-- Step 1: Upload -->
      <section class="step" id="step-upload">
        <div class="dropzone" id="dropzone"
             ondragover="event.preventDefault(); this.classList.add('drag-over')"
             ondragleave="this.classList.remove('drag-over')"
             ondrop="onDrop(event)"
             onclick="document.getElementById('file-input').click()">
          <input type="file" id="file-input" accept="video/*" style="display:none"
                 onchange="onFileSelected(this.files)">
          <div class="dropzone-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="dropzone-title">Перетащите видео сюда</div>
          <div class="dropzone-hint">или нажмите для выбора файла</div>
        </div>

        <div class="divider">
          <span>или укажите путь на сервере</span>
        </div>

        <div class="path-row">
          <input type="text" id="local-path" class="input-path"
                 placeholder="/workspace/video.mp4"
                 onkeydown="if(event.key==='Enter') loadFromPath()">
          <button class="btn-secondary" onclick="loadFromPath()">Открыть</button>
        </div>

        <div class="upload-progress" id="upload-progress" style="display:none">
          <div class="upload-bar"><div class="upload-bar-fill" id="upload-bar-fill"></div></div>
          <span class="upload-label">Загрузка файла...</span>
        </div>
      </section>

      <!-- Step 2: Ready -->
      <section class="step" id="step-ready" style="display:none">
        <div class="video-card">
          <div class="video-thumb" id="video-thumb"></div>
          <div class="video-details">
            <div class="video-name" id="video-name"></div>
            <div class="video-meta" id="video-meta"></div>
          </div>
          <button class="btn-icon" onclick="resetToUpload()" title="Сменить видео">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <button class="btn-primary" id="btn-start" onclick="startProcessing()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Убрать водяной знак
        </button>
      </section>

      <!-- Step 3: Processing -->
      <section class="step" id="step-processing" style="display:none">
        <div class="video-card video-card-sm">
          <div class="video-details">
            <div class="video-name" id="proc-video-name"></div>
            <div class="video-meta" id="proc-video-meta"></div>
          </div>
        </div>

        <div class="progress-block">
          <div class="progress-header">
            <span class="progress-pct" id="progress-pct">0%</span>
            <span class="progress-time" id="progress-time">0:00</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-status" id="progress-status">Подготовка...</div>
        </div>

        <button class="btn-ghost" id="btn-cancel" onclick="cancelProcessing()">Отменить</button>

        <details class="log-details">
          <summary>Подробный лог</summary>
          <div class="log-content" id="log"></div>
        </details>
      </section>

      <!-- Step 4: Done -->
      <section class="step" id="step-done" style="display:none">
        <div class="done-badge">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
        <div class="done-title">Готово!</div>
        <div class="done-subtitle" id="done-subtitle">Водяной знак успешно удалён</div>

        <a class="btn-download" id="btn-download" download>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Скачать видео
        </a>

        <button class="btn-ghost" onclick="resetToUpload()">Обработать другое видео</button>
      </section>

      <!-- Step 5: Error -->
      <section class="step" id="step-error" style="display:none">
        <div class="error-badge">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        </div>
        <div class="error-title">Ошибка обработки</div>
        <div class="error-text" id="error-text"></div>
        <button class="btn-secondary" onclick="resetToReady()">Попробовать снова</button>
        <button class="btn-ghost" onclick="resetToUpload()">Выбрать другое видео</button>
      </section>

    </main>

    <footer class="footer">
      <div class="device-switch">
        <button class="device-btn active" id="btn-cuda" onclick="setDevice('cuda')">GPU</button>
        <button class="device-btn" id="btn-cpu" onclick="setDevice('cpu')">CPU</button>
      </div>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
